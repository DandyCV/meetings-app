# PostgreSQL. Run `docker compose up -d` from the repo root to start a local
# server matching these defaults (see docker-compose.yml).
#
#   gem install pg
#   gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "meetings_app") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "meetings_app") %>

development:
  <<: *default
  database: meetings_app_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: meetings_app_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
